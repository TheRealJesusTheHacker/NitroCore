name: Bug report
description: Report something broken in NitroCore
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Do not report security vulnerabilities here** —
        email them to **sentinelsafeguard@outlook.com** instead (see SECURITY.md).
  - type: input
    id: version
    attributes:
      label: NitroCore version
      description: e.g. v1.1.2, or the winget version you installed
      placeholder: v1.1.2
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      description: e.g. Windows 11 24H2
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: dropdown
    id: profile
    attributes:
      label: Active profile (if relevant)
      options:
        - Gaming
        - Cybersecurity
        - Not sure / N/A
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what actually happened.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Numbered steps, if you can reproduce it.
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Paste anything useful from the Status & Logs tab or %APPDATA%\NitroCore\logs. Redact anything personal.
      render: text
