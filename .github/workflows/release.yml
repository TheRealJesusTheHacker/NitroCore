name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-exe:
    name: Build Windows .exe
    runs-on: windows-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install dependencies
        # Hash-locked (owner policy 2026-10-25): both installs verify
        # hashes against the committed locks and fail loudly on any
        # mismatch. The PyInstaller install that used to be an inline
        # `pip install pyinstaller==6.11.1` (transitives floating) now
        # goes through requirements-release.lock.txt, generated from
        # the pins in requirements-release.txt.
        run: |
          pip install --require-hashes -r NitroCore/requirements.lock.txt
          pip install --require-hashes -r NitroCore/requirements-release.lock.txt
      - name: Build with PyInstaller
        run: |
          cd NitroCore
          pyinstaller --noconfirm nitrocore.spec
      - name: Build portable edition (PyInstaller one-folder)
        run: |
          cd NitroCore
          pyinstaller --noconfirm --distpath dist-portable --workpath build-portable nitrocore-portable.spec
      - name: Staged start proof (launcher-style spawn, incl. non-admin user)
        shell: pwsh
        run: |
          # The v1.1.4 field failure (WinError 740 from any
          # CreateProcess-based launcher) must never ship again:
          # prove the built executables carry no requireAdministrator
          # manifest and that the portable starts the way the
          # Technician's Toolkit launcher starts it — in the
          # standalone AND bundle layouts, and as a non-administrator
          # user. Runs before packaging, so a failure publishes
          # nothing. See NitroCore/tools/staged_start_proof.py.
          $ErrorActionPreference = 'Stop'
          $proof = Join-Path $PWD "proof-tmp"
          python NitroCore/tools/staged_start_proof.py "NitroCore/dist-portable/NitroCoreOptimizer" "NitroCore/dist/NitroCoreOptimizer.exe" $proof
          net user diagstd "Diag!Pass-2026" /add /y
          icacls $proof /grant "diagstd:(OI)(CI)M" /T /Q | Out-Null
          $pw = ConvertTo-SecureString "Diag!Pass-2026" -AsPlainText -Force
          $cred = New-Object System.Management.Automation.PSCredential("$env:COMPUTERNAME\diagstd", $pw)
          $py = (Get-Command python).Source
          $spawner = Join-Path $PWD "NitroCore\tools\staged_start_spawner.py"
          $bundleExe = Join-Path $proof "bundle\NitroCoreOptimizer.exe"
          foreach ($mode in @("selfcheck", "plain")) {
            $verdict = Join-Path $proof "verdict-$mode.json"
            $out = Join-Path $proof "bundle\selfcheck-$mode.out"
            $p = Start-Process -FilePath $py -ArgumentList "`"$spawner`" `"$bundleExe`" `"$verdict`" $mode `"$out`"" -Credential $cred -Wait -PassThru -WindowStyle Hidden
            Write-Host "spawner ($mode) process exit: $($p.ExitCode)"
            if (-not (Test-Path $verdict)) { throw "staged start proof: no verdict written for mode $mode" }
            Get-Content $verdict
            python -c "import json,sys; v=json.load(open(sys.argv[1])); m=sys.argv[2]; assert v['user_is_admin'] is False, ('vacuous: spawner ran elevated', v); assert v['spawn']=='OK', v; assert ((v['rc']==0 and v['out_exists']) if m=='selfcheck' else True), v; print('standard-user', m, 'verdict OK')" $verdict $mode
          }
      - name: Assemble NitroCorePortable.zip
        shell: pwsh
        run: |
          $stage = Join-Path $PWD "NitroCorePortable"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item -Recurse -Force "NitroCore/dist-portable/NitroCoreOptimizer/*" $stage
          Copy-Item -Force "NitroCore/portable/README-PORTABLE.txt" $stage
          if (-not (Test-Path (Join-Path $stage "NitroCoreOptimizer.exe"))) {
            Write-Host "Portable staging is missing NitroCoreOptimizer.exe"
            exit 1
          }
          Compress-Archive -Path "$stage/*" -DestinationPath "NitroCore/dist/NitroCorePortable.zip" -Force
          Get-Item "NitroCore/dist/NitroCorePortable.zip" | Select-Object Name, Length
      - name: Generate SHA256 hashes
        shell: pwsh
        run: |
          cd NitroCore/dist
          "NitroCoreOptimizer.exe", "NitroCorePortable.zip" | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash, $_ } | Out-File -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4
        with:
          subject-path: |
            NitroCore/dist/*.exe
            NitroCore/dist/NitroCorePortable.zip
            NitroCore/dist/SHA256SUMS.txt
      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            NitroCore/dist/*.exe
            NitroCore/dist/NitroCorePortable.zip
            NitroCore/dist/SHA256SUMS.txt
          generate_release_notes: true
      - name: List built artifacts (manual dispatch runs)
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          Get-ChildItem -Recurse NitroCore/dist, NitroCore/dist-portable | Select-Object FullName, Length
