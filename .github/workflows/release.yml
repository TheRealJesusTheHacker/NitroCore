name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-exe:
    name: Build Windows .exe
    runs-on: windows-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r NitroCore/requirements.txt
          pip install pyinstaller==6.11.1
      - name: Build with PyInstaller
        run: |
          cd NitroCore
          pyinstaller --noconfirm nitrocore.spec
      - name: Generate SHA256 hashes
        shell: pwsh
        run: |
          cd NitroCore/dist
          Get-ChildItem *.exe | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash, $_.Name } | Out-File -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4
        with:
          subject-path: |
            NitroCore/dist/*.exe
            NitroCore/dist/SHA256SUMS.txt
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            NitroCore/dist/*.exe
            NitroCore/dist/SHA256SUMS.txt
          generate_release_notes: true
