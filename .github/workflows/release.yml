name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-exe:
    name: Build Windows .exe
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r NitroCore/requirements.txt
          pip install pyinstaller
      - name: Build with PyInstaller
        run: |
          cd NitroCore
          pyinstaller --noconfirm nitrocore.spec
      - name: Generate SHA256 hashes
        shell: pwsh
        run: |
          cd NitroCore/dist
          Get-ChildItem *.exe | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash, $_.Name } | Out-File -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            NitroCore/dist/*.exe
            NitroCore/dist/SHA256SUMS.txt
          generate_release_notes: true
