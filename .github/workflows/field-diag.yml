name: FieldDiag (temporary)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag whose portable build to probe"
        default: "v1.1.4"

jobs:
  probe:
    name: Launcher-spawn probe (windows)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Download release portable, verify checksum, build layouts
        shell: pwsh
        env:
          TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force C:\diag | Out-Null
          Set-Location C:\diag
          $base = "https://github.com/TheRealJesusTheHacker/NitroCore/releases/download/$env:TAG"
          Invoke-WebRequest "$base/NitroCorePortable.zip" -OutFile portable.zip
          Invoke-WebRequest "$base/SHA256SUMS.txt" -OutFile SHA256SUMS.txt
          $want = ((Get-Content SHA256SUMS.txt | Select-String 'NitroCorePortable.zip').Line -split '\s+')[0]
          $got = (Get-FileHash portable.zip -Algorithm SHA256).Hash
          Write-Host "portable sha256 want=$want got=$got"
          if ($want -ne $got) { throw "checksum mismatch" }
          Expand-Archive portable.zip -DestinationPath standalone -Force
          New-Item -ItemType Directory -Force bundle | Out-Null
          Copy-Item -Recurse standalone\* bundle\
          New-Item -ItemType Directory -Force bundle\Charon, bundle\Beerus, bundle\ArgusData | Out-Null
          Set-Content bundle\Argus.exe "decoy"
          Set-Content bundle\TechniciansToolkit.exe "decoy"
          Write-Host "--- standalone:"; Get-ChildItem standalone | Select-Object -First 5 Name
          Write-Host "--- bundle root:"; Get-ChildItem bundle | Select-Object Name
      - name: Print embedded manifest level of the shipped exe
        shell: pwsh
        run: |
          python -c "d=open(r'C:\diag\standalone\NitroCoreOptimizer.exe','rb').read(); i=d.find(b'requestedExecutionLevel'); print(d[max(0,i-60):i+120].decode('utf-8','replace'))"
      - name: Direct probe (runner identity)
        shell: pwsh
        run: |
          whoami
          python "$env:GITHUB_WORKSPACE\field_diag_probe.py" C:\diag\result-direct.json
      - name: Standard-user probe (fresh local user, non-admin token)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          net user diagstd "Diag!Passw0rd-2026" /add
          icacls C:\diag /grant "diagstd:(OI)(CI)M" /T /Q | Out-Null
          $pw = ConvertTo-SecureString "Diag!Passw0rd-2026" -AsPlainText -Force
          $cred = New-Object System.Management.Automation.PSCredential("$env:COMPUTERNAME\diagstd", $pw)
          $py = (Get-Command python).Source
          Write-Host "python at $py"
          try {
            $p = Start-Process -FilePath $py -ArgumentList "`"$env:GITHUB_WORKSPACE\field_diag_probe.py`" C:\diag\result-std.json" -Credential $cred -Wait -PassThru -WindowStyle Hidden
            Write-Host "std probe exit code: $($p.ExitCode)"
          } catch {
            Write-Host "Start-Process -Credential failed: $($_.Exception.Message)"
          }
          if (Test-Path C:\diag\result-std.json) { Get-Content C:\diag\result-std.json } else { Write-Host "NO result-std.json" }
      - name: Trust-level probe (same user, restricted token)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $py = (Get-Command python).Source
          runas /trustlevel:0x20000 "`"$py`" `"$env:GITHUB_WORKSPACE\field_diag_probe.py`" C:\diag\result-trust.json"
          $deadline = (Get-Date).AddSeconds(60)
          while (-not (Test-Path C:\diag\result-trust.json) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 2 }
          if (Test-Path C:\diag\result-trust.json) { Get-Content C:\diag\result-trust.json } else { Write-Host "NO result-trust.json" }
