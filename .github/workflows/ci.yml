name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  compile:
    name: Compile check (all platforms)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
      - name: Byte-compile every module
        run: python -m compileall -q NitroCore
      - name: Import smoke test (platform-safe modules)
        run: |
          cd NitroCore
          python -c "import source.utils.platform as p; print('IS_WINDOWS =', p.IS_WINDOWS); print('hidden kwargs ok:', isinstance(p.hidden_subprocess_kwargs(), dict))"

  compile-windows:
    name: Compile check (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r NitroCore/requirements.txt
      - name: Byte-compile every module
        run: python -m compileall -q NitroCore

  tests:
    name: Tests (pytest, ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
      - name: Install test dependencies
        # requirements-dev.txt is Linux-safe: it does NOT pull in
        # requirements.txt (pywin32 has no Linux wheels). The suite only
        # exercises non-mutating logic and dry-run paths.
        run: pip install -r NitroCore/requirements-dev.txt
      - name: Run pytest
        run: python -m pytest NitroCore/tests -v

  lint:
    name: Lint & format (ruff + black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
      - name: Install linters
        run: pip install -r NitroCore/requirements-dev.txt
      - name: Ruff check
        run: ruff check NitroCore
      - name: Black format check
        run: black --check NitroCore
