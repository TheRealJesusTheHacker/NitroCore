name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  compile:
    name: Compile check (all platforms)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
      - name: Byte-compile every module
        run: python -m compileall -q NitroCore
      - name: Import smoke test (platform-safe modules)
        run: |
          cd NitroCore
          python -c "import source.utils.platform as p; print('IS_WINDOWS =', p.IS_WINDOWS); print('hidden kwargs ok:', isinstance(p.hidden_subprocess_kwargs(), dict))"

  compile-windows:
    name: Compile check (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
      - name: Install dependencies
        # Hash-locked (owner policy 2026-10-25): verified against
        # NitroCore/requirements.lock.txt; fails loudly on mismatch.
        run: pip install --require-hashes -r NitroCore/requirements.lock.txt
      - name: Byte-compile every module
        run: python -m compileall -q NitroCore

  tests:
    name: Tests (pytest, ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
      - name: Install test dependencies
        # requirements-dev.txt is Linux-safe: it does NOT pull in
        # requirements.txt (pywin32 has no Linux wheels). The suite only
        # exercises non-mutating logic and dry-run paths.
        # Hash-locked (owner policy 2026-10-25): installs the lock
        # generated from those pins; fails loudly on any mismatch.
        run: pip install --require-hashes -r NitroCore/requirements-dev.lock.txt
      - name: Run pytest
        run: python -m pytest NitroCore/tests -v

  lint:
    name: Lint & format (ruff + black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
      - name: Install linters
        run: pip install --require-hashes -r NitroCore/requirements-dev.lock.txt
      - name: Ruff check
        run: ruff check NitroCore
      - name: Black format check
        run: black --check NitroCore
