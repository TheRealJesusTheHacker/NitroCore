[build-system]
# S-3 (audit 2026-10-11): pinned — unpinned build deps drift the sdist/wheel.
requires = ["setuptools==75.8.2"]
build-backend = "setuptools.build_meta"

[project]
name = "NitroCore"
version = "1.1.3"
description = "Windows system optimizer — one-click Gaming & Cybersecurity tuning profiles, cleanup, and restore-point safety."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "JesusTheHacker" }]
keywords = ["windows", "system-optimizer", "gaming", "cybersecurity", "python"]
# Mirror NitroCore/requirements.txt (the canonical pin list). pywin32 is
# Windows-only, so it carries a platform marker here: the unmarked pin in
# requirements.txt is consumed by the Windows build host, while this
# project table may also be built on Linux (docs/CI) where pywin32 has
# no wheels.
dependencies = [
    "psutil==7.0.0",
    "pywin32==310; sys_platform == 'win32'",
]

# The importable package is NitroCore/source (imported everywhere as
# `source.*`). Without this section a root-level build fell back to
# setuptools auto-discovery, which failed metadata generation outright
# (multiple top-level directories). This finds the same package the
# NitroCore/setup.py build ships; the PyInstaller .exe path does not
# read this file's packaging sections.
[tool.setuptools.packages.find]
where = ["NitroCore"]
include = ["source", "source.*"]

[tool.pytest.ini_options]
testpaths = ["NitroCore/tests"]
markers = [
    "windows_only: requires a Windows runner (registry, services, powercfg paths)",
]

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.lint]
# E501 (line length) is black's job — ruff leaves long strings/comments alone
# so formatting stays a single tool's responsibility.
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.black]
line-length = 88
target-version = ["py39"]
